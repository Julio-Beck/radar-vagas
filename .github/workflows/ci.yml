name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Procurar segredos no histórico
        run: ./gitleaks git . --redact --verbose

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Análise estática
        run: semgrep scan --config p/default --metrics=off --error

  # TODO: ativar quando um linter for aprovado (dependência nova). Fixe as actions por SHA de commit, como abaixo.
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - name: Instalar
  #       run: TODO comando de instalar do AGENTS.md
  #     - name: Lint
  #       run: TODO comando de lint do AGENTS.md
  #     - name: Typecheck
  #       run: TODO comando de typecheck do AGENTS.md

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Testes
        run: python -B -m unittest discover -s tests
