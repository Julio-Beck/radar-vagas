<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Radar de Vagas</title>
<style>
  :root {
    /* 60% base */
    --bg: #f4f5f6;
    --surface: #ffffff;
    /* 30% secundária: texto e estrutura */
    --text: #15191e;
    --muted: #5b6470;
    --line: #dde1e5;
    /* 10% destaque: só no que é decisão (filtro ativo, vaga nova) */
    --accent: #1d4ed8;
    --accent-text: #ffffff;
    /* significado */
    --ok: #15803d;
    --maybe: #b45309;
    --off: #6b7280;

    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace;
    --gutter: 16px;
    --bar-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1114; --surface: #161a1f; --text: #e8ebee; --muted: #9aa3ad;
      --line: #2a3038; --accent: #4f7cff; --accent-text: #0b0d10;
      --ok: #4ade80; --maybe: #fbbf24; --off: #8b939c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1114; --surface: #161a1f; --text: #e8ebee; --muted: #9aa3ad;
    --line: #2a3038; --accent: #4f7cff; --accent-text: #0b0d10;
    --ok: #4ade80; --maybe: #fbbf24; --off: #8b939c;
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%;
    padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + 24px);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 var(--gutter); }

  /* topo */
  header { padding: 28px 0 16px; }
  h1 { font-size: 28px; line-height: 1.1; font-weight: 750; letter-spacing: -0.02em; }
  .sub { margin-top: 6px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .sub.atrasada { color: var(--maybe); }
  .busca {
    display: block; width: 100%; margin-top: 12px; padding: 12px 14px;
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 0; outline: none;
  }
  .busca:focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  /* abas (Vagas/Concursos) e perfil (TI/Direito) */
  .controles { margin-top: 16px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
  .controles .rotulo { display: block; margin-bottom: 4px; font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .alternar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); background: var(--surface); }
  .alternar button {
    font: inherit; font-size: 14px; color: var(--text); background: transparent;
    border: 0; border-radius: 0; min-height: 44px; padding: 0 8px; cursor: pointer;
  }
  .alternar button + button { border-left: 1px solid var(--line); }
  .alternar button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
  .alternar button:focus-visible, .barra button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .fontes { margin-top: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .fontes summary { cursor: pointer; padding: 4px 0; list-style: none; }
  .fontes summary::-webkit-details-marker { display: none; }
  .fontes summary::after { content: "  +"; }
  .fontes[open] summary::after { content: "  −"; }
  .fontes ul { list-style: none; padding: 6px 0 0; display: grid; gap: 4px; }
  .fontes .ruim { color: var(--maybe); }

  /* lista */
  #lista { border-top: 1px solid var(--line); }
  .vaga {
    display: block; padding: 16px 0; border-bottom: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  .vaga:active { background: var(--surface); }
  .vaga:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tags { display: flex; gap: 12px; align-items: center; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .selo { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .selo::before { content: ""; width: 8px; height: 8px; background: currentColor; }
  .selo.encaixa { color: var(--ok); }
  .selo.talvez { color: var(--maybe); }
  .selo.descartada { color: var(--off); }
  .nova { color: var(--accent); font-weight: 700; }
  .fav { color: var(--muted); }
  .vaga h2 { margin-top: 8px; font-size: 17px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
  .empresa { margin-top: 2px; font-size: 14px; color: var(--text); font-weight: 400; }
  .meta { margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .motivo { margin-top: 4px; font-size: 13px; color: var(--muted); text-wrap: pretty; }

  /* concursos: o salário vem primeiro */
  .salario { margin-top: 8px; font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .salario small { display: block; font-family: var(--sans); font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .salario.sem { font-size: 15px; font-weight: 500; color: var(--muted); }
  .cidade { margin-top: 2px; font-size: 14px; }
  .cargos { margin-top: 6px; font-size: 13px; text-wrap: pretty; }
  .cargos b { font-weight: 600; }
  .fecha { color: var(--maybe); }

  .vazio { padding: 48px 0; color: var(--muted); text-wrap: pretty; }
  .vazio strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

  /* barra de filtros, perto do polegar */
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
  }
  .barra .wrap { padding: 0; display: flex; gap: 8px; }
  .seg { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); }
  .barra button {
    font: inherit; font-size: 13px; color: var(--text); background: transparent;
    border: 0; border-radius: 0; min-height: 44px; padding: 0 6px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .barra button .n { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .barra button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .barra button[aria-pressed="true"] .n { color: inherit; opacity: 0.85; }
  .novas { border: 1px solid var(--line) !important; width: 72px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Radar de Vagas</h1>
    <p class="sub" id="atualizado"></p>
    <div class="controles">
      <div>
        <span class="rotulo" id="rotulo-aba">Mostrar</span>
        <div class="alternar" role="group" aria-labelledby="rotulo-aba">
          <button type="button" data-aba="vagas">Vagas</button>
          <button type="button" data-aba="concursos">Concursos</button>
        </div>
      </div>
      <div id="caixa-perfil">
        <span class="rotulo" id="rotulo-perfil">Perfil</span>
        <div class="alternar" role="group" aria-labelledby="rotulo-perfil" id="perfis"></div>
      </div>
    </div>
    <input class="busca" id="busca" type="search" placeholder="Filtrar por cargo, empresa ou cidade" aria-label="Filtrar">
    <details class="fontes" id="fontes"><summary></summary><ul></ul></details>
  </header>
  <main id="lista"></main>
</div>

<nav class="barra" aria-label="Filtros">
  <div class="wrap">
    <div class="seg" role="group" aria-label="Encaixe no perfil">
      <button type="button" data-classe="encaixa">Encaixa<span class="n"></span></button>
      <button type="button" data-classe="talvez">Talvez<span class="n"></span></button>
      <button type="button" data-classe="descartada">Fora<span class="n"></span></button>
    </div>
    <button type="button" class="novas" id="novas">Novas<span class="n"></span></button>
  </div>
</nav>

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sem = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// páginas antigas não tinham perfis nem concursos
DADOS.perfis = DADOS.perfis || { ti: "TI" };
DADOS.concursos = DADOS.concursos || [];
DADOS.fontesConcursos = DADOS.fontesConcursos || [];
DADOS.vagas.forEach(v => { if (!v.perfis) v.perfis = { ti: [v.classe, v.motivo] }; });

const PERFIS = Object.keys(DADOS.perfis);
const estado = {
  aba: ler("radar.aba") === "concursos" ? "concursos" : "vagas",
  perfil: PERFIS.includes(ler("radar.perfil")) ? ler("radar.perfil") : PERFIS[0],
  classe: ler("radar.classe") || "encaixa",
  soNovas: ler("radar.novas") === "1",
  busca: "",
};

const UF_NOME = { RS: "Rio Grande do Sul", SC: "Santa Catarina", PR: "Paraná", SP: "São Paulo" };

function diasAtras(iso) {
  if (!iso) return "";
  const [a, m, d] = iso.split("-").map(Number);
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const n = Math.round((hoje - new Date(a, m - 1, d)) / 864e5);
  if (n <= 0) return "hoje";
  if (n === 1) return "ontem";
  return `há ${n} dias`;
}

function prazo(iso) {
  if (!iso) return "";
  const [a, m, d] = iso.split("-").map(Number);
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const n = Math.round((new Date(a, m - 1, d) - hoje) / 864e5);
  const data = `${String(d).padStart(2, "0")}/${String(m).padStart(2, "0")}`;
  if (n <= 0) return { texto: `inscrições até hoje (${data})`, perto: true };
  if (n === 1) return { texto: `inscrições até amanhã (${data})`, perto: true };
  return { texto: `inscrições até ${data} · faltam ${n} dias`, perto: n <= 3 };
}

function textoAtualizado(iso) {
  const t = new Date(iso);
  const hora = t.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  const hoje = new Date();
  const ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
  const dia = t.toDateString() === hoje.toDateString() ? "hoje"
            : t.toDateString() === ontem.toDateString() ? "ontem"
            : t.toLocaleDateString("pt-BR");
  const qtd = estado.aba === "vagas" ? `${itensDoPerfil().length} vagas` : `${itensDoPerfil().length} concursos`;
  return `Atualizado ${dia} às ${hora} · ${qtd}`;
}

const fonteOk = f => /^\d+ encontrad/.test(f.status) && !/problema/.test(f.status);

// itens da aba atual que valem pro perfil escolhido
function itensDoPerfil() {
  const lista = estado.aba === "vagas" ? DADOS.vagas : DADOS.concursos;
  return lista.filter(x => x.perfis[estado.perfil]);
}
const classeDe = x => x.perfis[estado.perfil][0];

function cabecalho() {
  // a maior pausa normal entre buscas é de 12h (18h17 às 6h17)
  const atrasada = Date.now() - new Date(DADOS.atualizado) > 16 * 36e5;
  $("#atualizado").textContent = textoAtualizado(DADOS.atualizado) + (atrasada ? " · busca atrasada" : "");
  $("#atualizado").classList.toggle("atrasada", atrasada);
  const fontes = estado.aba === "vagas" ? DADOS.fontes : DADOS.fontesConcursos;
  const ruins = fontes.filter(f => !fonteOk(f));
  $("#fontes").hidden = !fontes.length;
  $("#fontes summary").textContent = ruins.length
    ? `Fontes: ${fontes.length - ruins.length} ok, ${ruins.length} com problema`
    : `Fontes: todas ok`;
  $("#fontes ul").innerHTML = fontes.map(f =>
    `<li class="${fonteOk(f) ? "" : "ruim"}">${esc(f.nome)}: ${esc(f.status)}</li>`).join("");
  $("#busca").placeholder = estado.aba === "vagas" ? "Filtrar por cargo, empresa ou cidade" : "Filtrar por órgão, cargo ou cidade";
  document.querySelectorAll("[data-aba]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.aba === estado.aba)));
  document.querySelectorAll("[data-perfil]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.perfil === estado.perfil)));
}

function filtradas() {
  const q = sem(estado.busca);
  return itensDoPerfil().filter(x => {
    if (estado.soNovas && !x.nova) return false;
    if (!q) return true;
    const texto = estado.aba === "vagas"
      ? `${x.titulo} ${x.empresa} ${x.local}`
      : `${x.orgao} ${x.titulo} ${x.cidade} ${x.uf} ${UF_NOME[x.uf] || ""} ${x.perfis[estado.perfil][2].join(" ")}`;
    return sem(texto).includes(q);
  });
}

const ROTULO = { encaixa: "Encaixa", talvez: "Talvez", descartada: "Fora do perfil" };

function cartaoVaga(v) {
  const [classe, motivo] = v.perfis[estado.perfil];
  const jaDizRemoto = /remot|home office/i.test(v.local || "");
  const local = v.remoto && !jaDizRemoto ? (v.local ? `Remoto · ${v.local}` : "Remoto") : (v.local || "Local não informado");
  const meta = [local, v.fontes.join(", "), diasAtras(v.data)].filter(Boolean).join(" · ");
  return `<a class="vaga" href="${esc(v.link)}" target="_blank" rel="noopener">
    <div class="tags">
      <span class="selo ${classe}">${ROTULO[classe]}</span>
      ${v.nova ? '<span class="nova">Nova</span>' : ""}
      ${v.favorita ? '<span class="fav">★ Favorita</span>' : ""}
    </div>
    <h2>${esc(v.titulo)}</h2>
    <p class="empresa">${esc(v.empresa || "Empresa não informada")}</p>
    <p class="meta">${esc(meta)}</p>
    ${classe === "encaixa" ? "" : `<p class="motivo">${esc(motivo)}</p>`}
  </a>`;
}

const EDITAL = {
  "lido": "edital lido",
  "bloqueado": "edital não lido: o site da banca bloqueia robôs",
  "sem pdf": "edital não encontrado",
  "pdf escaneado": "edital é imagem escaneada",
  "sem link": "edital não encontrado",
};

function cartaoConcurso(c) {
  const [classe, motivo, cargos, doCargo, origem] = c.perfis[estado.perfil];
  let salario;
  if (doCargo) salario = `${brl(doCargo)}<small>salário do cargo · ${origem === "edital" ? "conferido no edital" : "segundo a notícia"}</small>`;
  else if (c.salario && c.estagio) salario = `${esc(c.salarioTexto)}<small>bolsa</small>`;
  const local = !c.uf ? (c.cidade ? `${c.cidade} · órgão nacional` : "Nacional · vagas pelo país")
              : c.cidade ? `${c.cidade} · ${c.uf}`
              : `${UF_NOME[c.uf] || c.uf} · cidade não informada`;
  const p = prazo(c.ate);
  const edital = c.edital === "lido" && c.editalOficial ? "edital lido no site oficial" : (EDITAL[c.edital] || "");
  const meta = [c.vagas, c.fonte, edital].filter(Boolean).join(" · ");
  return `<a class="vaga concurso" href="${esc(c.link)}" target="_blank" rel="noopener">
    <div class="tags">
      <span class="selo ${classe}">${ROTULO[classe]}</span>
      ${c.nova ? '<span class="nova">Novo</span>' : ""}
      ${c.estagio ? '<span class="fav">Estágio</span>' : ""}
    </div>
    ${salario ? `<p class="salario">${salario}</p>` : `<p class="salario sem">Salário do cargo não confirmado<small>${
      c.salarioMin ? `o edital paga de ${brl(c.salarioMin)} a ${esc(c.salarioTexto)}, conforme o cargo`
      : c.salario ? `o maior salário do edital é ${esc(c.salarioTexto)} (pode ser de outro cargo)` : "confira no edital"}</small></p>`}
    <h2>${esc(c.orgao)}</h2>
    <p class="cidade" title="${esc((c.cidades || []).join(", "))}">${esc(local)}</p>
    ${cargos.length ? `<p class="cargos"><b>Cargos pra você:</b> ${esc(cargos.join(" · "))}</p>` : ""}
    <p class="motivo">${esc(motivo)}</p>
    <p class="meta">${p ? `<span class="${p.perto ? "fecha" : ""}">${esc(p.texto)}</span> · ` : ""}${esc(meta)}</p>
  </a>`;
}

const brl = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

function vazio() {
  const nome = estado.aba === "vagas" ? "vaga" : "concurso";
  if (!itensDoPerfil().length) {
    return estado.aba === "vagas"
      ? `<div class="vazio"><strong>Nenhuma vaga nesta rodada.</strong>Veja em "Fontes" se alguma está com problema. A próxima busca roda sozinha.</div>`
      : `<div class="vazio"><strong>Nenhum concurso aberto encontrado.</strong>Veja em "Fontes" se alguma está com problema. A próxima busca roda sozinha.</div>`;
  }
  if (estado.soNovas) return `<div class="vazio"><strong>Nada novo aqui nas últimas 24h.</strong>Toque em "Novas" para ver tudo desta categoria.</div>`;
  if (estado.busca) return `<div class="vazio"><strong>Nada com "${esc(estado.busca)}".</strong>Tente outra palavra ou outra aba.</div>`;
  if (estado.classe === "encaixa") {
    return estado.aba === "vagas"
      ? `<div class="vazio"><strong>Nenhuma vaga com encaixe certo agora.</strong>Dê uma olhada em "Talvez": costumam ser vagas boas que não dizem o nível no título.</div>`
      : `<div class="vazio"><strong>Nenhum concurso com encaixe certo agora.</strong>Dê uma olhada em "Talvez": são editais que podem servir, mas vale conferir os requisitos.</div>`;
  }
  return `<div class="vazio"><strong>Nenhum ${nome} nesta aba.</strong></div>`;
}

const PESO = { encaixa: 2, talvez: 1, descartada: 0 };
function ordenar(lista) {
  if (estado.aba === "concursos") {
    // o salário é o que mais importa: primeiro os de salário do cargo confirmado, do maior pro menor;
    // depois os outros, pelo menor salário do edital; empate: o que fecha antes
    const conhecido = x => x.perfis[estado.perfil][3] || (x.estagio ? x.salario : 0) || 0;
    return lista.sort((a, b) => (conhecido(b) > 0) - (conhecido(a) > 0) || conhecido(b) - conhecido(a) ||
      (b.salarioMin || 0) - (a.salarioMin || 0) || String(a.ate || "9").localeCompare(String(b.ate || "9")));
  }
  return lista.sort((a, b) =>
    PESO[classeDe(b)] - PESO[classeDe(a)] || (b.favorita - a.favorita) || (b.nova - a.nova) ||
    String(b.data || "").localeCompare(String(a.data || "")));
}

function render() {
  cabecalho();
  const base = filtradas();
  const visiveis = ordenar(base.filter(x => classeDe(x) === estado.classe));
  document.querySelectorAll(".seg button").forEach(b => {
    const c = b.dataset.classe;
    b.setAttribute("aria-pressed", String(c === estado.classe));
    $(".n", b).textContent = base.filter(x => classeDe(x) === c).length;
  });
  const btnNovas = $("#novas");
  btnNovas.firstChild.textContent = estado.aba === "vagas" ? "Novas" : "Novos";
  btnNovas.setAttribute("aria-pressed", String(estado.soNovas));
  $(".n", btnNovas).textContent = itensDoPerfil().filter(x => x.nova).length;
  const cartao = estado.aba === "vagas" ? cartaoVaga : cartaoConcurso;
  $("#lista").innerHTML = visiveis.length ? visiveis.map(cartao).join("") : vazio();
}

$("#perfis").innerHTML = PERFIS.map(p => `<button type="button" data-perfil="${esc(p)}">${esc(DADOS.perfis[p])}</button>`).join("");
$("#caixa-perfil").hidden = PERFIS.length < 2;

document.querySelectorAll("[data-aba]").forEach(b => b.addEventListener("click", () => {
  estado.aba = b.dataset.aba; guardar("radar.aba", estado.aba);
  render(); window.scrollTo(0, 0);
}));
document.querySelectorAll("[data-perfil]").forEach(b => b.addEventListener("click", () => {
  estado.perfil = b.dataset.perfil; guardar("radar.perfil", estado.perfil);
  render(); window.scrollTo(0, 0);
}));
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  estado.classe = b.dataset.classe; guardar("radar.classe", estado.classe);
  render(); window.scrollTo(0, 0);
}));
$("#novas").addEventListener("click", () => {
  estado.soNovas = !estado.soNovas; guardar("radar.novas", estado.soNovas ? "1" : "0"); render();
});
$("#busca").addEventListener("input", e => { estado.busca = e.target.value.trim(); render(); });

render();
</script>
</body>
</html>
